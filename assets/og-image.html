<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview source</title>
<!-- Source for assets/og-image.png (1200×630). Re-render with a headless browser after editing. -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;1,6..96,600&family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .card {
    position: relative; overflow: hidden;
    width: 1200px; height: 630px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: #fbefd9;
    background:
      radial-gradient(ellipse 50% 62% at 50% 46%, rgba(255, 226, 170, .32), transparent 70%),
      radial-gradient(ellipse 120% 80% at 50% 125%, rgba(0, 0, 0, .7), transparent 60%),
      repeating-linear-gradient(90deg, #4a0c19 0 8px, #6e1426 28px, #8a1c31 44px, #6e1426 60px, #4a0c19 80px);
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 84px;
    background:
      radial-gradient(circle at 50% 0, #a32740 0 42px, #5c0f1f 44px, transparent 45px) 0 0 / 90px 84px repeat-x,
      linear-gradient(#5c0f1f, #5c0f1f) 0 0 / 100% 34px no-repeat;
    filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .45));
  }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 78px; height: 10px;
    background: repeating-linear-gradient(90deg, #e6b85c 0 2px, transparent 2px 7px); opacity: .7;
  }
  .drape {
    position: absolute; top: 0; bottom: 0; width: 120px;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, .4), transparent 40%, rgba(0, 0, 0, .3)),
      repeating-linear-gradient(90deg, #3d0914 0 10px, #741628 30px, #9b2239 46px, #741628 62px, #3d0914 80px);
    box-shadow: 0 0 40px rgba(0, 0, 0, .6);
  }
  .drape.l { left: 0; border-radius: 0 0 70% 0 / 0 0 14% 0; }
  .drape.r { right: 0; border-radius: 0 0 0 70% / 0 0 0 14%; }
  .kicker { font: 600 18px/1 Inter, sans-serif; letter-spacing: .38em; text-transform: uppercase; color: #f0cf8a; margin: 36px 0 18px; }
  h1 {
    margin: 0; font: 700 112px/.95 "Bodoni Moda", serif; letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff6d8 0%, #f2cf7d 45%, #c08a2e 80%, #f6dc98 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(60, 10, 20, .55));
  }
  h1 em { font-style: italic; font-weight: 600; }
  .bulbs { display: flex; gap: 18px; margin: 26px 0 22px; }
  .bulbs i { width: 11px; height: 11px; border-radius: 50%; background: #ffe7a8; box-shadow: 0 0 8px 3px rgba(255, 214, 120, .8), 0 0 20px 6px rgba(255, 190, 80, .35); }
  .bulbs i:nth-child(even) { opacity: .45; }
  .tag { font: italic 500 32px/1.3 "Cormorant Garamond", serif; color: #f6e3c2; margin: 0; }
  .cast { display: flex; gap: 14px; margin-top: 30px; }
  .cast span {
    font: 600 17px/1 Inter, sans-serif; color: #fbefd9; padding: 11px 18px; border-radius: 999px;
    background: rgba(0, 0, 0, .25); border: 1px solid rgba(246, 227, 194, .35);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="drape l"></div><div class="drape r"></div>
    <div class="kicker">Sierra presents</div>
    <h1>Roleplay <em>Resources</em></h1>
    <div class="bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="tag">SillyTavern presets, extensions, and Reverie</p>
    <div class="cast"><span>🌹 Rosie</span><span>🥀 Velvet Vigil</span><span>💌 LOVESICK</span><span>📋 CALLBOARD</span></div>
  </div>
</body>
</html>
